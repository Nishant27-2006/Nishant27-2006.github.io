  <style>
    body {
      font-family: "Noto Sans", sans-serif;
      margin-top: 1.5em;
      color: #36342f;
      line-height: 1.65;
      -webkit-text-size-adjust: 100%;
    }

    a { color: #3273dc; }
    .content a { text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .section { padding: 3rem 1.5rem; }

    /* ---------- shared header ---------- */
    .blog-head { padding-bottom: 1.25rem; }
    .blog-eyebrow {
      font-size: .78rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #9a9086;
      font-weight: 700;
      margin-bottom: .55rem;
    }
    .blog-back {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      font-size: .88rem;
      color: #7a736a;
      text-decoration: none;
    }
    .blog-back:hover { color: #bf5700; }

    .post-date {
      font-weight: 700; color: #4a4a4a;
      display: inline-block;
      background: #f4ede4; border: 1px solid #ecdcc8;
      padding: 2px 11px; border-radius: 20px; font-size: .82rem;
    }

    /* ---------- gate ---------- */
    .gate { max-width: 25rem; margin: 0 auto; }
    .gate-card {
      background: #fff;
      border: 1px solid #ececec;
      border-radius: 10px;
      padding: 2.1rem 1.9rem;
      box-shadow: 0 18px 38px -26px rgba(10, 10, 10, .5);
      text-align: center;
    }
    .gate-lock {
      width: 3rem; height: 3rem;
      margin: 0 auto 1.1rem;
      border-radius: 50%;
      background: #f4ede4;
      border: 1px solid #ecdcc8;
      display: flex; align-items: center; justify-content: center;
      color: #bf5700; font-size: 1.15rem;
    }
    .gate-card .field { margin-top: 1.35rem; }
    .gate-card input {
      box-shadow: none;
      border-color: #dcdcdc;
      text-align: center;
      letter-spacing: .08em;
    }
    .gate-card input:focus {
      border-color: #bf5700;
      box-shadow: 0 0 0 .11em rgba(191, 87, 0, .22);
    }
    .gate-error {
      color: #c0392b;
      font-size: .85rem;
      min-height: 1.4em;
      margin-top: .7rem;
    }
    .gate-card.is-wrong { animation: shake .34s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      22% { transform: translateX(-7px); }
      44% { transform: translateX(6px); }
      68% { transform: translateX(-4px); }
      86% { transform: translateX(3px); }
    }
    .btn-ut {
      background: #bf5700; border-color: #bf5700; color: #fff;
    }
    .btn-ut:hover, .btn-ut:focus {
      background: #a84c00; border-color: #a84c00; color: #fff;
    }

    /* ---------- flashcard reader ---------- */
    .reader { max-width: 44rem; margin: 0 auto; }

    .progress-rail {
      height: 3px;
      background: #ededed;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1.6rem;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: #bf5700;
      border-radius: 3px;
      transition: width .3s ease;
    }

    /* Height follows the card. The padding just gives the shadow room to
       breathe, since the stage clips the sliding card horizontally. */
    .card-stage {
      position: relative;
      overflow: hidden;
      padding: 5px 0 30px;
    }

    .flash-card {
      width: 100%;
      background: #fff;
      border: 1px solid #ececec;
      border-radius: 10px;
      padding: 2.3rem 2.2rem;
      box-shadow: 0 18px 38px -26px rgba(10, 10, 10, .42);
      transition: transform .19s ease, opacity .19s ease;
      will-change: transform, opacity;
    }
    .flash-card.no-anim { transition: none; }
    .flash-card.shift-left  { transform: translateX(-26px); opacity: 0; }
    .flash-card.shift-right { transform: translateX(26px);  opacity: 0; }

    .card-label {
      display: inline-block;
      font-size: .72rem;
      letter-spacing: .13em;
      text-transform: uppercase;
      font-weight: 700;
      color: #bf5700;
      background: #f4ede4;
      border: 1px solid #ecdcc8;
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 1rem;
    }
    .card-body {
      font-size: clamp(1rem, .955rem + .28vw, 1.075rem);
      line-height: 1.75;
      color: #36342f;
      overflow-wrap: break-word;
    }
    .card-body.is-note {
      font-size: clamp(.95rem, .91rem + .22vw, 1rem);
      color: #55504a;
      border-left: 3px solid #ecdcc8;
      padding-left: 1.15rem;
    }
    .card-eq {
      display: block;
      font-family: "Castoro", Georgia, serif;
      font-size: clamp(1.3rem, 1.1rem + 1vw, 1.6rem);
      color: #bf5700;
      margin-bottom: .85rem;
      letter-spacing: .01em;
    }

    /* The photo's box is sized in JS from the real image dimensions before the
       bytes arrive, so the card reserves exactly the space it needs — no blank
       filler, no reflow when the photo appears. */
    .card-figure {
      margin: 1.5rem auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .55rem;
    }
    .card-figure img {
      display: block;
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #ececec;
      background: #faf8f6;
      opacity: 0;
      transition: opacity .28s ease;
    }
    .card-figure img.is-loaded { opacity: 1; }
    .card-figure figcaption {
      font-size: .78rem;
      color: #9a9086;
      text-align: center;
      font-style: italic;
    }

    .reader-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.7rem;
    }
    .card-counter {
      font-size: .84rem;
      color: #9a9086;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .nav-btn {
      border-color: #e2e2e2;
      color: #4a4a4a;
      background: #fff;
      transition: transform .15s ease, border-color .15s ease, color .15s ease;
    }
    .nav-btn:hover:not([disabled]) {
      border-color: #bf5700;
      color: #bf5700;
      transform: translateY(-1px);
    }
    .nav-btn[disabled] { opacity: .42; }

    .reader-hint {
      text-align: center;
      font-size: .78rem;
      color: #b0a79d;
      margin-top: 1.5rem;
    }
    .reader-hint kbd {
      background: #f6f3ef;
      border: 1px solid #e6ded4;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: .74rem;
      color: #8a8177;
    }

    .card-end {
      text-align: center;
      margin-top: 1.6rem;
      font-size: .88rem;
      color: #9a9086;
    }

    @media (max-width: 768px) {
      body { margin-top: .75em; }
      .section { padding: 1.75rem 1rem; }
      .reader { max-width: none; }
      .blog-head { padding-bottom: 1rem; }
      .flash-card { padding: 1.6rem 1.25rem; border-radius: 9px; }
      .card-stage { padding-bottom: 22px; }
      .card-body.is-note { padding-left: .9rem; }
      .card-figure { margin-top: 1.2rem; }
      .reader-hint { display: none; }
      .reader-controls { margin-top: 1.3rem; gap: .5rem; }
      .reader-controls .button { padding-left: .8em; padding-right: .8em; }
      .card-counter { font-size: .78rem; }
      .gate { max-width: none; }
      .gate-card { padding: 1.8rem 1.35rem; }
    }

    /* Very narrow phones: drop the button labels, keep the arrows. */
    @media (max-width: 380px) {
      .flash-card { padding: 1.35rem 1.05rem; }
      .nav-btn span:not(.icon) { display: none; }
      .reader-controls .button { padding-left: .7em; padding-right: .7em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flash-card, .progress-fill, .nav-btn, .card-figure img { transition: none; }
      .gate-card.is-wrong { animation: none; }
    }
  </style>
</head>

  <!-- ===================== GATE ===================== -->
  <section class="section" id="gate-section">
    <div class="container is-max-desktop">
      <div class="gate">
        <div class="gate-card" id="gate-card">
          <div class="gate-lock"><i class="fas fa-lock"></i></div>
          <h1 class="title is-5" style="margin-bottom:.4rem">Blog</h1>
          <p class="is-size-7 has-text-grey">
            This one is private. Enter the password to read.
          </p>

          <form id="gate-form" autocomplete="off">
            <div class="field">
              <div class="control">
                <input class="input" type="password" id="gate-input"
                       placeholder="password" aria-label="Blog password"
                       autocomplete="current-password" spellcheck="false">
              </div>
            </div>
            <button class="button btn-ut is-fullwidth" type="submit" id="gate-submit">
              <span class="icon is-small"><i class="fas fa-lock-open"></i></span>
              <span>Unlock</span>
            </button>
          </form>

          <p class="gate-error" id="gate-error" role="alert"></p>
        </div>

        <p class="has-text-centered" style="margin-top:1.4rem">
          <a class="blog-back" href="index.html">
            <i class="fas fa-arrow-left"></i> Back to homepage
          </a>
        </p>
      </div>
    </div>
  </section>

  <!-- ===================== READER ===================== -->
  <section class="section" id="reader-section" hidden>
    <div class="container is-max-desktop">
      <div class="reader">

        <div class="blog-head">
          <a class="blog-back" href="index.html">
            <i class="fas fa-arrow-left"></i> Back to homepage
          </a>
          <div class="blog-eyebrow" style="margin-top:1.2rem">Blog &middot; No. 1</div>
          <h1 class="title is-3" id="post-title" style="margin-bottom:.75rem"></h1>
          <span class="post-date" id="post-date"></span>
        </div>

        <div class="progress-rail">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="card-stage" id="card-stage">
          <article class="flash-card" id="flash-card" tabindex="-1"
                   aria-live="polite" aria-atomic="true">
            <span class="card-label" id="card-label" hidden></span>
            <div class="card-body" id="card-body"></div>
            <figure class="card-figure" id="card-figure" hidden>
              <img id="card-image" alt="">
              <figcaption id="card-caption" hidden></figcaption>
            </figure>
          </article>
        </div>

        <div class="reader-controls">
          <button class="button nav-btn is-rounded" id="prev-btn" type="button">
            <span class="icon is-small"><i class="fas fa-chevron-left"></i></span>
            <span>Back</span>
          </button>

          <span class="card-counter" id="card-counter"></span>

          <button class="button nav-btn is-rounded" id="next-btn" type="button">
            <span>Next</span>
            <span class="icon is-small"><i class="fas fa-chevron-right"></i></span>
          </button>
        </div>

        <p class="card-end" id="card-end" hidden>
          That&rsquo;s the end &mdash; thanks for reading.
          <a href="#" id="restart-link">Start over</a>
        </p>

        <p class="reader-hint">
          Use <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to move between cards
        </p>

        <p class="has-text-centered" style="margin-top:1.9rem">
          <a class="blog-back" id="lock-link" href="#">
            <i class="fas fa-lock"></i> Lock this blog
          </a>
        </p>

      </div>
    </div>
  </section>

      function deriveKey(password) {
        return crypto.subtle.importKey(
          'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
        ).then(function (base) {
          return crypto.subtle.deriveKey(
            {
              name: 'PBKDF2',
              salt: b64ToBytes(payload.salt),
              iterations: payload.kdf.iterations,
              hash: payload.kdf.hash
            },
            base,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt']
          );
        });
      }

      function decryptPost(password) {
        return deriveKey(password).then(function (key) {
          return crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: b64ToBytes(payload.iv) }, key, b64ToBytes(payload.ct)
          ).then(function (buf) {
            var data = JSON.parse(new TextDecoder().decode(buf));
            mediaKey = key; // only reached when the password was right
            return data;
          });
        });
      }

      /* ---------- encrypted photos ---------- */

      var mediaUrls = {};   // id -> object URL
      var mediaPending = {}; // id -> promise

      function loadMedia(id) {
        if (mediaUrls[id]) return Promise.resolve(mediaUrls[id]);
        if (mediaPending[id]) return mediaPending[id];

        var entry = payload.media && payload.media[id];
        if (!entry || !mediaKey) return Promise.reject(new Error('no media ' + id));

        mediaPending[id] = fetch(entry.file).then(function (res) {
          if (!res.ok) throw new Error('fetch ' + res.status);
          return res.arrayBuffer();
        }).then(function (buf) {
          return crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: b64ToBytes(entry.iv) }, mediaKey, buf
          );
        }).then(function (plain) {
          var url = URL.createObjectURL(new Blob([plain], { type: entry.mime }));
          mediaUrls[id] = url;
          delete mediaPending[id];
          return url;
        }).catch(function (err) {
          delete mediaPending[id];
          throw err;
        });

        return mediaPending[id];
      }

      // Guards against a slow decrypt landing after the reader moved on.
      var imageToken = 0;
      var currentDims = null;

      // Reserve the photo's exact box up front: scaled to fit the card's width
      // and a slice of the viewport height, so nothing jumps or pads out blank.
      function sizeImage() {
        if (!currentDims || !currentDims.w || !currentDims.h) {
          imageEl.style.removeProperty('width');
          imageEl.style.removeProperty('height');
          return;
        }
        var styles = window.getComputedStyle(cardEl);
        var avail = cardEl.clientWidth
          - parseFloat(styles.paddingLeft || 0)
          - parseFloat(styles.paddingRight || 0);
        if (!(avail > 0)) avail = 320;

        var maxH = Math.max(180, Math.min(window.innerHeight * 0.58, 440));
        var scale = Math.min(avail / currentDims.w, maxH / currentDims.h);
        if (scale > 1) scale = 1; // never upscale past the original

        imageEl.style.width = Math.round(currentDims.w * scale) + 'px';
        imageEl.style.height = Math.round(currentDims.h * scale) + 'px';
      }

      function showImage(card) {
        var token = ++imageToken;
        var image = card && card.image;
        var entry = image && payload.media && payload.media[image.id];

        imageEl.classList.remove('is-loaded');

        if (!entry) {
          figureEl.hidden = true;
          imageEl.removeAttribute('src');
          currentDims = null;
          sizeImage();
          return;
        }

        figureEl.hidden = false;
        imageEl.alt = image.alt || '';
        currentDims = entry.dims || null;
        sizeImage();

        if (image.caption) {
          captionEl.textContent = image.caption;
          captionEl.hidden = false;
        } else {
          captionEl.hidden = true;
        }

        loadMedia(image.id).then(function (url) {
          if (token !== imageToken) return; // user already navigated away
          imageEl.src = url;
          imageEl.classList.add('is-loaded');
        }).catch(function () {
          if (token !== imageToken) return;
          figureEl.hidden = true; // missing or unreadable photo: just show the text
          imageEl.removeAttribute('src');
          currentDims = null;
        });
      }

      var resizeRaf = null;
      window.addEventListener('resize', function () {
        if (resizeRaf) return;
        resizeRaf = requestAnimationFrame(function () {
          resizeRaf = null;
          sizeImage();
        });
      });

      function prefetchNeighbours(i) {
        [i - 1, i + 1].forEach(function (n) {
          var c = post && post.cards[n];
          if (c && c.image) loadMedia(c.image.id).catch(function () {});
        });
      }

      /* ---------- flashcard reader ---------- */

      var post = null;
      var total = 0;
      var idx = 0;
      var swapTimer = null;
      var SWAP_MS = 190;

      function render(i) {
        var card = post.cards[i];

        bodyEl.innerHTML = card.html;
        bodyEl.className = 'card-body' + (card.kind ? ' is-' + card.kind : '');

        if (card.label) {
          labelEl.textContent = card.label;
          labelEl.hidden = false;
        } else {
          labelEl.hidden = true;
        }

        showImage(card);

        counterEl.textContent = (i + 1) + ' / ' + total;
        fillEl.style.width = ((i + 1) / total * 100) + '%';
        prevBtn.disabled = i === 0;
        nextBtn.disabled = i === total - 1;
        endEl.hidden = i !== total - 1;

        prefetchNeighbours(i);
      }

      function go(target, dir) {
        if (target < 0) target = 0;
        if (target > total - 1) target = total - 1;
        if (target === idx) return;

        var forward = dir || (target > idx ? 1 : -1);
        idx = target;

        clearTimeout(swapTimer);
        cardEl.classList.remove('no-anim', 'shift-left', 'shift-right');
        cardEl.classList.add(forward > 0 ? 'shift-left' : 'shift-right');

        swapTimer = setTimeout(function () {
          render(idx);

          // Jump instantly to the far side, then animate back in.
          cardEl.classList.add('no-anim');
          cardEl.classList.remove('shift-left', 'shift-right');
          cardEl.classList.add(forward > 0 ? 'shift-right' : 'shift-left');
          void cardEl.offsetWidth; // force reflow so the jump is not animated

          requestAnimationFrame(function () {
            cardEl.classList.remove('no-anim');
            requestAnimationFrame(function () {
              cardEl.classList.remove('shift-left', 'shift-right');
            });
          });

          // Deliberately no scrolling here — the page stays exactly where it is.
        }, SWAP_MS);
      }

      function startReader(data) {
        post = data;
        total = post.cards.length;
        idx = 0;

        document.title = post.title + ' – Nishant Gadde';
        titleEl.textContent = post.title;
        dateEl.textContent = post.date;

        render(0);

        // Unlocked: the gate is gone for good, not just hidden.
        gateSection.remove();
        readerSection.hidden = false;
        cardEl.focus({ preventScroll: true });
      }

      function lock() {
        cache.clear();
        location.reload();
      }

      prevBtn.addEventListener('click', function () { go(idx - 1, -1); });
      nextBtn.addEventListener('click', function () { go(idx + 1, 1); });

      restartLink.addEventListener('click', function (e) {
        e.preventDefault();
        go(0, -1);
      });

      lockLink.addEventListener('click', function (e) {
        e.preventDefault();
        lock();
      });

      document.addEventListener('keydown', function (e) {
        if (readerSection.hidden) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;

        if (e.key === 'ArrowRight' || e.key === 'PageDown') {
          e.preventDefault(); go(idx + 1, 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault(); go(idx - 1, -1);
        } else if (e.key === 'Home') {
          e.preventDefault(); go(0, -1);
        } else if (e.key === 'End') {
          e.preventDefault(); go(total - 1, 1);
        }
      });

      // Swipe (touch only; ignores vertical scrolling).
      var tx = 0, ty = 0, tracking = false;
      stageEl.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) { tracking = false; return; }
        tx = e.touches[0].clientX;
        ty = e.touches[0].clientY;
        tracking = true;
      }, { passive: true });

      stageEl.addEventListener('touchend', function (e) {
        if (!tracking) return;
        tracking = false;
        var t = e.changedTouches[0];
        var dx = t.clientX - tx;
        var dy = t.clientY - ty;
        if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
        go(dx < 0 ? idx + 1 : idx - 1, dx < 0 ? 1 : -1);
      }, { passive: true });

      /* ---------- gate ---------- */

      function setBusy(busy) {
        gateSubmit.classList.toggle('is-loading', busy);
        gateSubmit.disabled = busy;
        gateInput.disabled = busy;
      }

      function fail(message) {
        gateError.textContent = message;
        gateCard.classList.remove('is-wrong');
        void gateCard.offsetWidth;
        gateCard.classList.add('is-wrong');
        gateInput.value = '';
        gateInput.focus();
      }

      function attempt(password, fromCache) {
        if (!password) { gateInput.focus(); return; }
        gateError.textContent = '';
        setBusy(true);

        decryptPost(password).then(function (data) {
          cache.set(password);
          setBusy(false);
          // Kept out of the catch below so a render bug is never reported as a
          // wrong password.
          try {
            startReader(data);
          } catch (err) {
            gateError.textContent = 'Unlocked, but the post failed to render.';
            if (window.console) console.error(err);
          }
        }).catch(function () {
          setBusy(false);
          if (fromCache) {
            cache.clear();
            gateInput.focus();
          } else {
            fail('Wrong password. Try again.');
          }
        });
      }

      gateForm.addEventListener('submit', function (e) {
        e.preventDefault();
        attempt(gateInput.value, false);
      });

      if (!window.crypto || !window.crypto.subtle) {
        gateError.textContent =
          'This browser cannot decrypt the post (Web Crypto unavailable over http). Open the site over https.';
        setBusy(true);
      } else {
        var saved = cache.get();
        if (saved) attempt(saved, true);
        else gateInput.focus();
      }
    })();
  </script>

</body>

</html>
